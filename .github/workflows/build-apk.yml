
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '選擇要編譯的版本'
        required: true
        type: choice
        options:
          - old
          - v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir source
          if [ "${{ inputs.version }}" = "v2" ]; then
            unzip investment-quiz-android-v2.zip -d source
          else
            unzip investment-quiz-android.zip -d source
          fi

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: investment-quiz-${{ inputs.version }}-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
